<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review card — Maverik Electric Inc</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .card {
      max-width: 520px;
      margin: 1.5rem auto 3rem;
      background: #fffdf6;
      border: 8px solid #4a2e18;
      padding: 1.4rem 1.5rem 1.8rem;
      box-shadow: 0 10px 0 #4a2e18;
    }
    .card img { width: 220px; height: 220px; display: block; margin: 0.8rem auto; background: #fff; }
    .card .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1rem; }
    .card .actions button, .card .actions a {
      background: #4a2e18; color: #f3ead4; text-decoration: none; border: 0;
      padding: 0.55rem 0.8rem; cursor: pointer; font-weight: 600;
    }
    @media print {
      .shop-bar, .card .actions, .lang { display: none !important; }
      .card { box-shadow: none; margin: 0; }
    }
  </style>
</head>
<body>
  <header class="shop-bar">
    <div class="mark">Maverik Electric Inc.
      <small data-en="Printable review card" data-es="Tarjeta de reseña para imprimir">Printable review card</small>
    </div>
    <nav class="lang" aria-label="Language">
      <button type="button" data-set="en" aria-pressed="true">EN</button>
      <button type="button" data-set="es" aria-pressed="false">ES</button>
    </nav>
  </header>
  <article class="card">
    <p class="tag" data-en="Leave a review if the job was right" data-es="Deje una reseña si el trabajo quedó bien">Leave a review if the job was right</p>
    <h1>Maverik Electric Inc.</h1>
    <p data-en="Matt Meyer &amp; Meghan Meyer · License 1070787 · El Cajon" data-es="Matt Meyer y Meghan Meyer · Licencia 1070787 · El Cajon">Matt Meyer &amp; Meghan Meyer · License 1070787 · El Cajon</p>
    <p><a class="plain" href="tel:+16197843914">(619) 784-3914</a> · 11505 Oralane Drive, El Cajon, CA 92020</p>
    <img src="review-qr.svg" width="220" height="220" alt="QR code to find Maverik Electric Inc. on Google">
    <p data-en="Scan to find us on Google and leave a review." data-es="Escanee para encontrarnos en Google y dejar una reseña.">Scan to find us on Google and leave a review.</p>
    <div class="actions">
      <button type="button" id="print-card" data-en="Print this card" data-es="Imprimir esta tarjeta">Print this card</button>
      <a href="index.html" data-en="Back to the frame" data-es="Volver al marco">Back to the desks</a>
    </div>
  </article>
  <script src="script.js"></script>
</body>
</html>
